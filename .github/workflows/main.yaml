name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    ci:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22.x"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: TypeScript check
              run: npm run lint:ts

            - name: ESLint
              run: npm run lint

            - name: SCSS lint
              run: npm run lint:scss

            - name: Unit tests
              run: npm run test:unit -- --run

            - name: Build
              run: npm run build